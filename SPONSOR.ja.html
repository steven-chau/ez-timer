<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投げ銭 — EZ インターバルタイマー</title>
  <style>
    :root {
      --bg: #151122;
      --surface: #1e1835;
      --text: #ece6f6;
      --text-secondary: #b0a0cc;
      --accent: #f0c040;
      --radius: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 2rem 2rem 1.75rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .card h1 {
      font-size: 1.35rem;
      margin-bottom: 0.5rem;
    }
    .card p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 1.25rem 0;
    }
    .method h2 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }
    .method img {
      max-width: 200px;
      height: auto;
      border-radius: 8px;
      margin-bottom: 0.5rem;
    }
    .method .note {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }
    .thanks {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 1.25rem;
    }
    .back-link {
      display: inline-block;
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-decoration: none;
      margin-bottom: 0.75rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--text); }
    .bmac-img { max-width: 180px; height: auto; display: inline-block; }
  </style>
</head>
<body>
<div class="card">
  <a href="https://steven-chau.github.io/ez-timer/" class="back-link">&larr; 戻る</a>
  <h1>投げ銭</h1>
  <p>EZ インターバルタイマーは無料、広告なし、オープンソースです。投げ銭でこのプロジェクトの継続的な開発を支援してください。</p>

  <hr class="divider">

  <div class="method">
    <h2>Buy Me a Coffee</h2>
    <p class="note">一度きりまたは毎月の支援でプロジェクトをサポートできます。</p>
    <a href="https://buymeacoffee.com/stevenchau" target="_blank" rel="noopener"><img src="./img/bmc-button.png" alt="コーヒーをおごる" class="bmac-img"></a>
  </div>

  <hr class="divider">

  <div class="method">
    <h2>暗号通貨</h2>
    <p class="note">以下の QR コードをスキャンして暗号通貨で投げ銭できます。</p>
    <img src="./sponsor/crypto-qr.png" alt="暗号通貨 QR コード">
    <p class="note"><strong>対応通貨：</strong>USDT（ERC-20 / Polygon）</p>
  </div>

  <p class="thanks">ご支援ありがとうございます！</p>
</div>
</body>
</html>
