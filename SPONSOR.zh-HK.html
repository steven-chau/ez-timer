<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贊助支持 — 簡易計時器</title>
  <style>
    :root {
      --bg: #151122;
      --surface: #1e1835;
      --text: #ece6f6;
      --text-secondary: #b0a0cc;
      --accent: #f0c040;
      --radius: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 2rem 2rem 1.75rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .card h1 {
      font-size: 1.35rem;
      margin-bottom: 0.5rem;
    }
    .card p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 1.25rem 0;
    }
    .method h2 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }
    .method img {
      max-width: 200px;
      height: auto;
      border-radius: 8px;
      margin-bottom: 0.5rem;
    }
    .method .note {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }
    .thanks {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 1.25rem;
    }
    .back-link {
      display: inline-block;
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-decoration: none;
      margin-bottom: 0.75rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--text); }
    .bmac-img { max-width: 180px; height: auto; display: inline-block; }
  </style>
</head>
<body>
<div class="card">
  <a href="https://steven-chau.github.io/ez-interval-timer/" class="back-link">&larr; 返回</a>
  <h1>贊助支持</h1>
  <p>簡易計時器係免費、無廣告、開源嘅應用程式。你嘅贊助可以幫手維持呢個項目，支持持續開發。</p>

  <hr class="divider">

  <div class="method">
    <h2>Buy Me a Coffee</h2>
    <p class="note">透過一次性或每月捐款支持呢個項目。</p>
    <a href="https://buymeacoffee.com/stevenchau" target="_blank" rel="noopener"><img src="./img/bmc-button.png" alt="請我飲咖啡" class="bmac-img"></a>
  </div>

  <hr class="divider">

  <div class="method">
    <h2>加密貨幣</h2>
    <p class="note">掃瞄以下 QR Code 發送加密貨幣捐款。</p>
    <img src="./sponsor/crypto-qr.png" alt="Crypto QR Code">
    <p class="note"><strong>接受：</strong>USDT（ERC-20 / Polygon）</p>
  </div>

  <hr class="divider">

  <div class="method">
    <h2>WeChat Pay</h2>
    <p class="note">掃瞄以下 QR Code 用微信支付捐款。</p>
    <img src="./sponsor/wechatpay-qr.png" alt="WeChat Pay QR Code">
  </div>

  <p class="thanks">多謝你嘅支持！</p>
</div>
</body>
</html>
